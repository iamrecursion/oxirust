[package]
name = "oxiephemeris-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
description = "OxiEphemeris: WebAssembly bindings — compute full natal charts, synastry, transits, progressions, composites, and their Linked Open Data (Turtle/RDF) entirely in the browser from a DE ephemeris buffer"
keywords = ["astrology", "ephemeris", "wasm", "webassembly", "chart"]
categories = ["science", "wasm", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxiephemeris-chart.workspace = true
oxiephemeris-de = { workspace = true, features = ["std"] }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
