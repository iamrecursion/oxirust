[workspace]
resolver = "2"
members = [
    "crates/oxiephemeris-core",
    "crates/oxiephemeris-de",
    "crates/oxiephemeris-bodies",
    "crates/oxiephemeris-astro",
    "crates/oxiephemeris-analytic",
    "crates/oxiephemeris-compat",
    "crates/oxiephemeris-rdf",
    "crates/oxiephemeris-lod",
    "crates/oxiephemeris-chart",
    "crates/oxiephemeris-py",
    "crates/oxiephemeris-wasm",
    "crates/oxiephemeris-cli",
    "xtask",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
# 1.89 is required by `oxigraph` and the `oxrdf`/`oxttl` crates it pulls
# in (they declare `rust-version = "1.87"` and `edition = "2024"`); the
# rest of the workspace would still build on 1.81.
rust-version = "1.89"
license = "Apache-2.0"
readme = "README.md"
authors = ["COOLJAPAN OU (Team Kitasan)"]
repository = "https://github.com/cool-japan/oxiephemeris"

[workspace.dependencies]
libm = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

# --- Linked Open Data stack -------------------------------------------
# All Pure Rust. The RDF model and the Turtle/N-Triples codec come from
# OxiXML; they keep the `oxrdf`/`oxttl` names here so the crates that build
# graphs read the same as the surrounding RDF literature. `oxigraph`'s
# default feature is `rocksdb`, which pulls the C++ `oxrocksdb-sys`;
# `default-features = false` drops it and leaves an in-memory `Store` whose
# `query`/`update`/`load_from_reader`/`dump_to_writer` all still work.
# `oxhttp`'s default enables `client` (pulls `url`) — we take `server` only,
# which also keeps the optional `flate2` out (COOLJAPAN compression policy).
oxrdf = { package = "oxixml-model", version = "0.1.2" }
oxttl = { package = "oxixml-turtle", version = "0.1.2" }
oxigraph = { version = "0.5", default-features = false }
oxhttp = { version = "0.3", default-features = false, features = ["server"] }
sha2 = "0.10"

oxiephemeris-core = { path = "crates/oxiephemeris-core", version = "0.1.2" }
oxiephemeris-de = { path = "crates/oxiephemeris-de", version = "0.1.2" }
oxiephemeris-bodies = { path = "crates/oxiephemeris-bodies", version = "0.1.2" }
oxiephemeris-astro = { path = "crates/oxiephemeris-astro", version = "0.1.2" }
oxiephemeris-analytic = { path = "crates/oxiephemeris-analytic", version = "0.1.2" }
oxiephemeris-compat = { path = "crates/oxiephemeris-compat", version = "0.1.2" }
oxiephemeris-rdf = { path = "crates/oxiephemeris-rdf", version = "0.1.2" }
oxiephemeris-lod = { path = "crates/oxiephemeris-lod", version = "0.1.2" }
oxiephemeris-chart = { path = "crates/oxiephemeris-chart", version = "0.1.2" }

# --- Binding stacks ----------------------------------------------------
# PyO3 (abi3, so one wheel covers Python 3.8+) and wasm-bindgen. Both are
# the canonical binding layers for their targets; neither pulls a C/C++
# dependency of its own beyond the host Python it links against.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
pyo3-build-config = "0.29"
pythonize = "0.29"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
