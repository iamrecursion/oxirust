# OxiEphemeris PyPI Publishing Workflow
# Author: COOLJAPAN OU (Team Kitasan)
# License: Apache-2.0
#
# Publishes oxiephemeris Python wheels (abi3) to PyPI via Trusted Publishing
# Triggered by: v* tags or manual workflow_dispatch

name: pypi-publish

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - pypi
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels (abi3 — one wheel covers Python 3.8+)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path crates/oxiephemeris-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: github.event.inputs.publish_target == 'pypi' || (github.event_name == 'push' && !contains(github.ref, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
