[package]
name = "oxixml-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Zero-dependency substrate for the OxiXML workspace: safe SWAR byte scanning, line/column tracking, deterministic PRNGs, FIPS 180-4 SHA/HMAC, and a minimal unsigned bigint (in-tree replacement for memchr, sha1/sha2, and rand_pcg)."
keywords = ["xml", "rdf", "hash", "prng", "bigint"]
categories = ["algorithms", "parsing", "cryptography", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
