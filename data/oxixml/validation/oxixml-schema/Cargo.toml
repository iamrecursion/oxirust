[package]
name = "oxixml-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "W3C XML Schema (XSD 1.0/1.1) validation (replaces Apache Xerces schema)."
keywords = ["xml", "xsd", "schema", "validation", "xerces"]
categories = ["parser-implementations", "encoding", "data-structures"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
oxixml-support = { workspace = true }
oxixml-xml = { workspace = true }
oxixml-encoding = { workspace = true }
oxixml-qname = { workspace = true }
oxixml-xsd = { workspace = true }
oxixml-regex = { workspace = true }
oxixml-dom = { workspace = true }
oxixml-infoset = { workspace = true }
oxixml-xpath = { workspace = true }

[dev-dependencies]
oxixml-dom = { path = "../../trees/oxixml-dom" }
oxixml-encoding = { path = "../../support/oxixml-encoding" }

[lints]
workspace = true
