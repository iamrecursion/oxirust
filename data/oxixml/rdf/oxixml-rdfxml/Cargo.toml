[package]
name = "oxixml-rdfxml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RDF/XML parser and serializer (replaces oxrdfxml)."
keywords = ["rdfxml", "rdf", "xml", "parser", "serializer"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
oxixml-model = { workspace = true }
oxixml-iri = { workspace = true }
oxixml-langtag = { workspace = true }
oxixml-xml = { workspace = true }
oxixml-qname = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
oxixml-turtle = { path = "../oxixml-turtle" }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[features]
default = []

## Enables asynchronous parsing and serialization on top of `tokio`'s
## `AsyncRead` / `AsyncWrite`, mirroring `oxrdfxml`'s `async-tokio` feature:
## `RdfXmlParser::for_tokio_async_reader` and
## `RdfXmlSerializer::for_tokio_async_writer`. Off by default, so the crate
## stays third-party-free in its default configuration.
async-tokio = ["dep:tokio", "oxixml-xml/async-tokio"]

[lints]
workspace = true
