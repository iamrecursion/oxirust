[package]
name = "oxixml-json"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Streaming JSON event parser and writer (replaces json-event-parser)."
keywords = ["json", "parser", "streaming", "rfc8259", "serializer"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
oxixml-support = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[features]
default = []

## Enables asynchronous parsing and serialization on top of `tokio`'s
## `AsyncRead` / `AsyncWrite`, mirroring `json-event-parser`'s `async-tokio`
## feature: `TokioAsyncReaderJsonParser` and `TokioAsyncWriterJsonSerializer`.
## Off by default, so the crate stays third-party-free in its default
## configuration.
async-tokio = ["dep:tokio"]

[lints]
workspace = true
