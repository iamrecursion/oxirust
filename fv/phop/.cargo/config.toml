# Browser wasm has no OS entropy source: select getrandom's JS-backed backend (0.3/0.4) for
# wasm32-unknown-unknown. getrandom 0.2 uses its `js` *feature* instead (enabled in phop-wasm's
# manifest). This cfg only applies to the wasm target, so native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# macOS: the `phop-py` crate is a PyO3 extension module built with `pyo3/extension-module`,
# which deliberately does NOT link libpython. The host Python interpreter supplies the `_Py*`
# symbols at load time, so we let the linker leave them undefined and resolve them dynamically.
# Mirrors the COOLJAPAN sibling projects (quantrs, torsh). This is harmless for the other
# crates (they have no undefined symbols) and emits no linker warning on this toolchain.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
