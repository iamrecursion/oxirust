[package]
name = "oxiphoton"
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Pure Rust Computational Photonics & Optical Simulation Framework"
repository = "https://github.com/cool-japan/oxiphoton"
authors = ["COOLJAPAN OU (Team Kitasan)"]
documentation = "https://docs.rs/oxiphoton"
homepage = "https://github.com/cool-japan/oxiphoton"
keywords = ["photonics", "fdtd", "optics", "simulation", "photonic"]
categories = ["science::materials", "simulation"]
readme = "README.md"

[dependencies]
num-complex = { version = "0.4.6", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", optional = true }
thiserror = "2.0.18"
rayon = { version = "1.12.0", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
oxiblas = "0.2.2"
oxifft = "0.4.2"
# Pure Rust HTTP/1.1 client for the SPARQL bridge (blocking; no async runtime).
#
# `default-features = false` turns off BOTH halves of ureq's default set, each
# for its own policy reason:
#
#   * `gzip` — its backing crate is `flate2`, and COOLJAPAN routes compression
#     through `oxiarc-*`. Cost: SPARQL result bodies arrive uncompressed; they
#     are small JSON.
#   * `rustls` — that feature enables `ring`, which is C and assembly.
#     `rustls-no-provider` gives rustls *without* a crypto backend, and the
#     provider is supplied explicitly in `io::oxirs_bridge` as
#     `rustls-graviola` (Rust plus assembly; no `cc`, no `-sys` crate).
#
# `rustls-webpki-roots` bundles the Mozilla root store, so no system OpenSSL is
# involved either. Change this feature list and `oxirs_bridge::shared_agent`
# in the same commit, or not at all: dropping the provider here makes every
# HTTPS request fail at runtime instead of at compile time.
ureq = { version = "3.3.0", default-features = false, features = [
    "rustls-no-provider",
    "rustls-webpki-roots",
], optional = true }
rustls-graviola = { version = "0.4.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
approx = "0.5"

[features]
default = ["std", "smatrix", "fdtd", "fdtd-3d", "dispersive", "rcwa", "materials-builtin", "mode-solver", "bpm", "siph-devices", "ray-optics", "photonic-crystal", "fiber", "solar-optics"]
std = []
no_std_compat = []

# Solvers
fdtd = []
fdtd-3d = ["fdtd"]
bpm = []
smatrix = []
rcwa = ["smatrix"]
mode-solver = []
ray-optics = []

# Physics
dispersive = ["fdtd"]
nonlinear = ["fdtd"]
photonic-crystal = []

# Devices
siph-devices = ["mode-solver"]
metalens = ["fdtd", "rcwa"]
fiber = ["mode-solver"]
interconnect = ["siph-devices"]
solar-optics = ["smatrix"]

# Inverse design
inverse-design = ["fdtd"]
topology-opt = ["inverse-design"]

# Materials
materials-builtin = []

# I/O
io-gds = []
io-vtk = []
io-hdf5 = []
io-oxirs = ["dep:ureq", "dep:rustls-graviola", "dep:serde_json"]

# Performance
simd = []
parallel = ["std", "rayon"]
gpu-wgpu = ["std", "dep:wgpu", "dep:pollster"]

[[bench]]
name = "smatrix_bench"
harness = false

[[bench]]
name = "fdtd_bench"
harness = false

[[bench]]
name = "bpm_bench"
harness = false

[[bench]]
name = "fdtd_gpu_bench"
harness = false
