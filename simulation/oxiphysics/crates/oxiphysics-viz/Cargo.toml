[package]
name = "oxiphysics-viz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Visualization utilities for the OxiPhysics engine"
readme = "README.md"
categories = ["science", "visualization"]
keywords = ["physics", "visualization", "rendering", "simulation", "graphics"]

[dependencies]
rand = { workspace = true }
thiserror = { workspace = true }
oxifft = { workspace = true }
oxiphysics-core = { workspace = true }
oxiphysics-gpu = { workspace = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxifft = { workspace = true, features = ["threading"] }
